name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: bun install --frozen-lockfile

      - run: bun run check-types
      - run: bun test
      - run: bun run build

      - name: Create GitHub Release
        run: bunx changelogen gh release --token ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm
        run: |
          cd packages/api-client && npm publish --access public --provenance || true
          cd ../pulumi && npm publish --access public --provenance || true
          cd ../sst && npm publish --access public --provenance || true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
