name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC, no NPM_TOKEN) needs npm >= 11.5.1.
      - run: npm install -g npm@^11.5.1

      - run: bun install --frozen-lockfile

      - run: bun run check-types
      - run: bun test
      - run: bun run build

      - name: Create GitHub Release
        run: bunx changelogen gh release --token ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve workspace + catalog references for publish
        run: bun scripts/resolve-publish-specs.ts

      # Trusted publishing: npm exchanges this job's OIDC token (id-token: write)
      # for a short-lived publish credential — configured per package with
      # `npm trust github <pkg> --file release.yml --repo xantiagoma/dokploy-deploy`.
      # No NPM_TOKEN secret; provenance is attached automatically. Fails loudly;
      # an already-published version is skipped so a re-run is safe.
      - name: Publish to npm
        run: |
          for dir in api-client pulumi sst cli; do
            name=$(node -p "require('./packages/$dir/package.json').name")
            version=$(node -p "require('./packages/$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "skip $name@$version (already published)"
              continue
            fi
            (cd "packages/$dir" && npm publish --access public)
          done
